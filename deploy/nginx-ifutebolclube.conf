# Site iFutebolClube (www.ifutebolclube.com.br). Instalado por instalar_vm.sh em
# /etc/nginx/sites-available/ifutebolclube e ligado em sites-enabled.
# O HTTPS é acrescentado pelo certbot (instalar_vm.sh --https --email SEU@EMAIL).

# O endereço sem www vai para o com www.
server {
    listen 80;
    listen [::]:80;
    server_name ifutebolclube.com.br;
    return 301 $scheme://www.ifutebolclube.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.ifutebolclube.com.br;

    # O site (build do frontend). `current` aponta para a versão publicada mais recente.
    root /var/www/ifutebolclube/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Arquivos com hash no nome: podem ficar um ano no navegador.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Bandeiras (SVG).
    location /flags/ {
        expires 30d;
        try_files $uri =404;
    }

    # Dados do site (JSON). Ficam fora das versões porque os agentes os atualizam sozinhos.
    # Sem try_files de propósito: arquivo que não existe dá 404 de verdade (o site já trata o 404).
    location /data/ {
        alias /var/www/ifutebolclube/data/;
        expires -1;
        types {
            application/json json;
            application/geo+json geojson;
        }
    }

    # Rotas do site (React Router): qualquer endereço que não seja arquivo abre o index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
